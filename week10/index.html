<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub ユーザー検索ツール</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-6">
  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 mt-10">
    <h1 class="text-xl font-bold text-gray-800 text-center mb-6">GitHub ユーザー検索</h1>

    <!-- 検索フォーム -->
    <div class="flex gap-2 mb-6">
      <input
        type="text"
        id="username-input"
        placeholder="GitHubユーザー名を入力"
        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button
        id="search-btn"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium disabled:bg-gray-400"
      >
        検索
      </button>
    </div>

    <!-- メッセージ表示エリア（エラー/ローディング用） -->
    <p id="message" class="text-center text-sm font-medium mb-4 hidden"></p>

    <!-- 結果表示カード -->
    <div id="user-card" class="hidden flex-col items-center text-center pt-4 border-t border-gray-100">
      <img id="avatar" src="" alt="アバター画像" class="w-24 h-24 rounded-full shadow-sm mb-4 object-cover" />
      <h2 id="name" class="text-xl font-bold text-gray-800"></h2>
      <p id="bio" class="text-gray-600 text-sm mt-2 px-2"></p>
      
      <div class="flex justify-around w-full my-6 py-3 bg-slate-50 rounded-lg text-sm">
        <div>
          <span class="block text-xs text-gray-500">フォロワー</span>
          <span id="followers" class="font-bold text-gray-800 text-base"></span>
        </div>
        <div>
          <span class="block text-xs text-gray-500">公開リポジトリ</span>
          <span id="repos" class="font-bold text-gray-800 text-base"></span>
        </div>
      </div>

      <a
        id="profile-link"
        href=""
        target="_blank"
        rel="noopener noreferrer"
        class="text-blue-600 hover:underline text-sm font-medium"
      >
        GitHubプロフィールを見る →
      </a>
    </div>
  </div>

  <script>
    const usernameInput = document.getElementById('username-input');
    const searchBtn = document.getElementById('search-btn');
    const messageEl = document.getElementById('message');
    const userCard = document.getElementById('user-card');

    const avatarEl = document.getElementById('avatar');
    const nameEl = document.getElementById('name');
    const bioEl = document.getElementById('bio');
    const followersEl = document.getElementById('followers');
    const reposEl = document.getElementById('repos');
    const profileLinkEl = document.getElementById('profile-link');

    async function fetchGitHubUser() {
      const username = usernameInput.value.trim();
      if (!username) return;

      // 初期状態のリセットとローディング表示
      userCard.classList.add('hidden');
      messageEl.textContent = '読み込み中...';
      messageEl.className = 'text-center text-sm font-medium mb-4 text-gray-500 block';
      searchBtn.disabled = true;

      try {
        const response = await fetch(`https://api.github.com/users/${username}`);

        // 通信成否の判定
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('ユーザーが見つかりませんでした');
          } else {
            throw new Error('データの取得に失敗しました');
          }
        }

        const data = await response.json();
        console.log('取得したユーザーデータ:', data);

        // 画面へのデータ反映
        avatarEl.src = data.avatar_url;
        nameEl.textContent = data.name || data.login; // 名前未設定の場合はログイン名を表示
        bioEl.textContent = data.bio || '自己紹介はありません';
        followersEl.textContent = data.followers;
        reposEl.textContent = data.public_repos;
        profileLinkEl.href = data.html_url;

        messageEl.classList.add('hidden');
        userCard.classList.remove('hidden');
        userCard.classList.add('flex');

      } catch (error) {
        console.error(error);
        messageEl.textContent = error.message;
        messageEl.className = 'text-center text-sm font-medium mb-4 text-red-500 block';
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener('click', fetchGitHubUser);
    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchGitHubUser();
    });
  </script>
</body>
</html>
