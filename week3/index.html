<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール</title>
    <script src="https://cdn.tailwindcss.com"></script>     
</head>
<body class="bg-red-500 py-8">
 <main class="max-w-4x1 mx-auto px-4">
   <h1 class="text-4xl font-bold text-center text-white px-7 my-6">SHISHAMO</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white rounded-lg shadow p-6 mb-6 grid gap-4">
            <img src="asakochan.jpeg" alt="宮崎朝子のイラスト" class="w-full h-48 object-cover rounded-md mb-4">
        
            <h2 class="text-xl font-bold text-gray-800 mb-4">宮崎朝子</h2>
            <p class="text-gray-600 mb-2">Gt.Vo</p>
            <p class="text-gray-600 mb-2">1994年12月22日生まれ</p>
            <p class="text-gray-600 mb-2">tall:159.8cm</p>
            <p class="text-gray-600 mb-2">人生のバイブルになっている漫画：「天使なんかじゃない」「青野くんに触りたいから死にたい」</p></div>
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <img src="ayachan.jpeg" alt="松岡彩のイラスト" class="w-full h-48 object-cover rounded-md mb-4">
            <h2 class="text-xl font-bold text-gray-800 mb-4">松岡彩</h2>
            <p class="text-gray-600 mb-2">Ba</p>
            <p class="text-gray-600 mb-2">1996年1月31日生まれ</p>
            <p class="text-gray-600 mb-2">tall:153cm</p>
            <p class="text-gray-600 mb-2">最近のマイブーム：恋愛リアリティーショーを見ること。最近だと「ラブキャッチャージャパン」と「ラブデッドライン」を見ました。殿堂入りは「ラブトランジェット」です！</p></div>
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <img src="misakichan.jpeg" alt="吉川美冴貴のイラスト" class="w-full h-48 object-cover rounded-md mb-4">
            <h2 class="text-xl font-bold text-gray-800 mb-4">吉川美冴貴</h2>
            <p class="text-gray-600 mb-2">Dr</p> 
            <p class="text-gray-600 mb-2">1994年11月26日生まれ</p> 
            <p class="text-gray-600 mb-2">tall:156.5cm</p>   
            <p class="text-gray-600 mb-2">好きな食べ物：焼き芋、茄子の揚げびたし、カボチャの煮物</p>
        </div>
    </div>
 </main>
</body>
</html>
