<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員登録フォーム</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">会員登録</h1>

    <!-- フォーム全体用のメッセージエリア -->
    <div id="form-message" class="hidden p-3 mb-4 rounded text-center text-sm font-bold"></div>

    <!-- novalidate でブラウザデフォルトの検証を無効化 -->
    <form id="signup-form" novalidate class="space-y-4">
      
      <!-- 名前 -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">名前</label>
        <input type="text" id="name" name="name" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="name-error" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- メールアドレス -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
        <input type="email" id="email" name="email" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="email-error" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- パスワード -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード（8文字以上）</label>
        <input type="password" id="password" name="password" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="password-error" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- 利用規約同意 -->
      <div class="flex items-start">
        <div class="flex items-center h-5">
          <input type="checkbox" id="terms" name="terms" required class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
        </div>
        <div class="ml-2 text-sm">
          <label for="terms" class="font-medium text-gray-700">利用規約に同意する</label>
          <p id="terms-error" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>
      </div>

      <!-- 送信ボタン -->
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition duration-200">
        送信する
      </button>

    </form>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const formMessage = document.getElementById('form-message');

    form.addEventListener('submit', function(event) {
      // デフォルトの送信挙動（ページリロード）を停止
      event.preventDefault();

      let isValid = true;

      // 各要素の取得
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const termsInput = document.getElementById('terms');

      // エラーメッセージ要素の取得
      const nameError = document.getElementById('name-error');
      const emailError = document.getElementById('email-error');
      const passwordError = document.getElementById('password-error');
      const termsError = document.getElementById('terms-error');

      // 表示のリセット
      resetErrors([nameError, emailError, passwordError, termsError]);
      formMessage.classList.add('hidden');

      // 1. 名前バリデーション
      if (!nameInput.value.trim()) {
        showError(nameError, '名前を入力してください');
        isValid = false;
      }

      // 2. メールアドレスバリデーション
      if (!emailInput.value.trim()) {
        showError(emailError, 'メールアドレスを入力してください');
        isValid = false;
      }

      // 3. パスワードバリデーション
      if (!passwordInput.value) {
        showError(passwordError, 'パスワードを入力してください');
        isValid = false;
      } else if (passwordInput.value.length < 8) {
        showError(passwordError, 'パスワードは8文字以上で入力してください');
        isValid = false;
      }

      // 4. チェックボックスバリデーション
      if (!termsInput.checked) {
        showError(termsError, '利用規約への同意が必要です');
        isValid = false;
      }

      // バリデーション結果の判定
      if (isValid) {
        formMessage.textContent = '登録完了！';
        formMessage.className = 'p-3 mb-4 rounded text-center text-sm font-bold bg-green-100 text-green-700 block';
        form.reset(); // フォームの初期化
      }
    });

    // エラーメッセージ表示用関数
    function showError(element, message) {
      element.textContent = message;
      element.classList.remove('hidden');
    }

    // エラーメッセージリセット用関数
    function resetErrors(elements) {
      elements.forEach(el => {
        el.textContent = '';
        el.classList.add('hidden');
      });
    }
  </script>
</body>
</html>
