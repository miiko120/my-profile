<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MENU | CAFE MIIKO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <header class="bg-white p-4 shadow-sm text-center">
    <h1 class="text-xl font-bold text-green-700">CAFE MIIKO</h1>
    <p class="text-xs text-gray-500 mt-1">メニューページ</p>
  </header>

  <main class="max-w-2xl mx-auto p-4">
    
    <section class="mt-8">
      <h2 class="text-lg font-bold text-green-700 mb-4">● ドリンクメニュー</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <div class="bg-white rounded-lg shadow p-6 hover:text-green-700">
          <h3 class="text-base font-bold">ブレンドコーヒー</h3>
          <p class="text-gray-500 text-xs mt-2">お店で丁寧に淹れたこだわりのコーヒーです。</p>
          <p class="font-bold text-sm mt-4 text-right">500円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 hover:text-green-700">
          <h3 class="text-base font-bold">カフェラテ</h3>
          <p class="text-gray-500 text-xs mt-2">ミルクがたっぷり入ったまろやかなラテです。</p>
          <p class="font-bold text-sm mt-4 text-right">550円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 hover:text-green-700">
          <h3 class="text-base font-bold">紅茶</h3>
          <p class="text-gray-500 text-xs mt-2">香りの良いダージリンティーです。</p>
          <p class="font-bold text-sm mt-4 text-right">500円</p>
        </div>

      </div>
    </section>

    <section class="mt-12 mb-12">
      <h2 class="text-lg font-bold text-green-700 mb-4">● スイーツメニュー</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <div class="bg-white rounded-lg shadow p-6 hover:text-green-700">
          <h3 class="text-base font-bold">自家製プリン</h3>
          <p class="text-gray-500 text-xs mt-2">ちょっと固めのレトロなプリンです。</p>
          <p class="font-bold text-sm mt-4 text-right">450円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 hover:text-green-700">
          <h3 class="text-base font-bold">チーズケーキ</h3>
          <p class="text-gray-500 text-xs mt-2">濃厚でしっとりしたチーズケーキです。</p>
          <p class="font-bold text-sm mt-4 text-right">500円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 hover:text-green-700">
          <h3 class="text-base font-bold">チョコブラウニー</h3>
          <p class="text-gray-500 text-xs mt-2">チョコレートを贅沢に使った焼き菓子です。</p>
          <p class="font-bold text-sm mt-4 text-right">480円</p>
        </div>

      </div>
    </section>

  </main>

  <footer class="bg-gray-800 text-gray-400 p-4 text-center text-xs">
    <p>&copy; 2026 CAFE MIIKO</p>
  </footer>

</body>
</html>
